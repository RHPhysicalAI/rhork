apiVersion: v1
kind: Service
metadata:
  name: {{ include "genesis.fullname" . }}-metrics
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 9002
    targetPort: metrics
    name: metrics
  selector:
    {{- include "genesis.selectorLabels" . | nindent 4 }}
