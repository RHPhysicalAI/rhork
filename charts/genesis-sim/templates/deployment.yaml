{{- if not .Values.sim }}
{{- fail "sim is required: --set sim=<name>" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "genesis.fullname" . }}
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "genesis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "genesis.selectorLabels" . | nindent 8 }}
    spec:
      {{- if eq .Values.gpu.vendor "nvidia" }}
      runtimeClassName: nvidia
      nodeSelector:
        {{- toYaml .Values.gpu.nvidia.nodeSelector | nindent 8 }}
      {{- else if eq .Values.gpu.vendor "amd" }}
      nodeSelector:
        {{- toYaml .Values.gpu.amd.nodeSelector | nindent 8 }}
      securityContext:
        supplementalGroups: [44]
      {{- end }}
      containers:
      - name: genesis
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: STREAM_PREFIX
          value: {{ .Values.sim | quote }}
        - name: MEDIAMTX_HOST
          value: "{{ .Values.mediamtx.host }}:{{ .Values.mediamtx.rtspPort }}"
        - name: WORLD_FILE
          value: "/worlds/{{ .Values.world }}.gen"
        - name: SIM_STEP_FREQ
          value: {{ .Values.genesis.timestep | quote }}
        - name: ENCODING_FPS
          value: "30"
        - name: ENCODING_BITRATE
          value: "4000k"
        ports:
        - containerPort: 9002
          name: metrics
        volumeMounts:
        - name: worlds
          mountPath: /worlds
          readOnly: true
        {{- if .Values.persistence.enabled }}
        - name: cache
          mountPath: /cache
        {{- end }}
        resources:
          {{- if eq .Values.gpu.vendor "nvidia" }}
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
            nvidia.com/gpu: 1
          {{- else if eq .Values.gpu.vendor "amd" }}
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
            amd.com/gpu: 1
          {{- else }}
          {{- toYaml .Values.resources | nindent 10 }}
          {{- end }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ps aux | grep genesis_streamer | grep -v grep
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: worlds
        configMap:
          name: {{ .Values.sim }}-worlds
      {{- if .Values.persistence.enabled }}
      - name: cache
        persistentVolumeClaim:
          claimName: {{ .Values.sim }}-cache
      {{- end }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.sim }}-cache
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
