apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediamtx.fullname" . }}-webrtc
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 8889
    targetPort: webrtc
    name: webrtc
  - port: 8554
    targetPort: rtsp
    name: rtsp
  selector:
    {{- include "mediamtx.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediamtx.fullname" . }}-api
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 9997
    targetPort: api
    name: api
  selector:
    {{- include "mediamtx.selectorLabels" . | nindent 4 }}
