{{- if .Values.coturn.discovery }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mediamtx.fullname" . }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mediamtx.fullname" . }}-pod-reader
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mediamtx.fullname" . }}-pod-reader
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mediamtx.fullname" . }}-pod-reader
subjects:
- kind: ServiceAccount
  name: {{ include "mediamtx.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
